[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogd-ir-for-good"
version = "0.1.0"
description = "Reproducible and auditable multi-criteria dataset ranking"
requires-python = ">=3.11"
authors = [{name = "Janick Spycher"}]
license = "MIT"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.scripts]
ogd-ir = "ogd_ir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
